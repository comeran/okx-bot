[project]
name = "okx-bot"
version = "0.1.0"
description = "OKX quantitative trading bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ccxt",
    "fastapi",
    "httpx",
    "pydantic",
    "python-dotenv",
    "pyyaml",
    "sqlmodel",
    "uvicorn[standard]",
    "websockets",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
